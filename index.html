<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0E1A16" />
<!-- 一枚暖黄的小灯点，和场景里的灯点同一个语言；顺手吃掉 favicon 的 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E1A16'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23FFF3D6'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23F3B26B' stroke-opacity='.55' stroke-width='1.2'/%3E%3C/svg%3E" />
<title>鳄梨岛 · 电子展厅</title>
<meta name="description" content="鳄梨导演的个人电子展厅" />
<style>
  :root {
    --paper: #F6F2EA;
    --ink: #235046;
    --green: #2F6E5F;
    --orange: #E8833A;
    --muted: #7C8B85;
    --dark: #0E1A16;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--dark);
    font-family: "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
  }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #overlay { position: fixed; inset: 0; pointer-events: none; }
  #overlay > * { pointer-events: auto; }
  #fade {
    position: fixed; inset: 0; background: var(--dark);
    opacity: 0; pointer-events: none; transition: opacity 420ms ease;
    z-index: 50;
  }
  #fade.on { opacity: 1; pointer-events: all; }

  .label {
    position: absolute; left: 0; top: 0;
    text-align: center; white-space: nowrap;
    transition: opacity 260ms ease;
    will-change: transform;
  }
  .label .name {
    font-size: 14px; font-weight: 700; letter-spacing: -0.01em;
    color: var(--ink);
  }
  .label .sub {
    font-size: 11px; color: var(--muted); margin-top: 2px;
  }
  .label.pickable { cursor: pointer; pointer-events: auto; }
  .label.pickable:hover .name { color: var(--orange); }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 26px; border-radius: 100px;
    background: var(--green); color: #fff; border: none;
    font-size: 13px; font-weight: 500; letter-spacing: 0.04em;
    cursor: pointer; font-family: inherit;
    transition: transform 200ms ease, background 200ms ease;
  }
  .btn:hover { background: var(--ink); transform: translateY(-1px); }
  .btn.ghost {
    background: transparent; color: #E8E2D6;
    border: 1px solid rgba(232,226,214,0.28);
  }
  .btn.ghost:hover { background: rgba(232,226,214,0.08); transform: none; }

  .corner {
    position: fixed; top: 26px; left: 30px; z-index: 20;
    display: flex; gap: 10px; align-items: center;
  }
  .corner .tag {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted);
  }
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 100px;
    background: rgba(255,255,255,0.72); backdrop-filter: blur(8px);
    border: 1px solid rgba(35,80,70,0.14); color: var(--ink);
    font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .back:hover { background: #fff; }

  .room-head {
    position: fixed; left: 30px; bottom: 34px; z-index: 20;
    max-width: 460px;
  }
  .room-head h1 {
    margin: 0 0 6px; font-size: 26px; font-weight: 900; letter-spacing: -0.03em;
    color: var(--ink);
  }
  .room-head p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; }

  .intro {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    text-align: center; padding: 24px;
  }
  .intro .kicker {
    font-size: 11px; letter-spacing: 0.34em; text-transform: uppercase;
    color: #9DBFB2;
  }
  .intro h1 {
    margin: 0; font-size: 52px; font-weight: 900; letter-spacing: -0.045em;
    color: #F1EAD9; line-height: 1.08;
  }
  .intro h1 em { font-style: normal; color: var(--orange); }
  .intro p {
    margin: 0; max-width: 460px; font-size: 14px; line-height: 1.85; color: #9BAEA6;
  }
  .hint {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 0.16em; color: #7E948C; z-index: 20;
  }
  /* ===== 开发者沙滩 ===== */
  /* 海浪是视频不是画布：wave.mp4 铺满 frame，静态图垫在底下兜底 */
  .beach-stage .cabin-layer { z-index: 1; }
  /* 动作层：海浪 + 猫，醒着时整体推近（原点由 JS 按猫头坐标写进 style） */
  .beach-motion {
    position: absolute; inset: 0; z-index: 2;
    transform: scale(1);
    transition: transform 1500ms cubic-bezier(0.22, 0.8, 0.3, 1);
    will-change: transform;
  }
  .beach-stage.is-awake .beach-motion { transform: scale(2); }

  .beach-wave {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    opacity: 0;
    transition: opacity 900ms ease, filter 1200ms ease;
    pointer-events: none;
  }
  .beach-wave.on { opacity: 1; }
  /* 醒来时把海虚掉：一来是景深，二来 1280 的片子推近 2 倍本来就软，
     轻度虚化反而比硬拉伸好看，注意力也才落得到猫身上 */
  .beach-stage.is-awake .beach-wave {
    filter: blur(1.6px) brightness(0.76) saturate(0.94);
  }

  /* 猫层：位置由 JS 按 CAT_BOX 写进 style（百分比，与底图同构图）。
     四边各留 9% 羽化带 —— 视频与底图有整体色差，硬边会看出一条缝。
     用两条 linear-gradient 相交，比 radial 更好控制：中间永远是实心，
     不会被挖掉猫耳朵，四角也不会透出底下的睡猫。 */
  .beach-catvid {
    position: absolute;
    display: block;
    object-fit: cover;
    opacity: 0;
    pointer-events: none;
    transition: opacity 700ms ease;
    -webkit-mask-image:
      linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%),
      linear-gradient(to bottom, transparent 0, #000 9%, #000 91%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%),
      linear-gradient(to bottom, transparent 0, #000 9%, #000 91%, transparent 100%);
    mask-composite: intersect;
  }
  .beach-catvid.on { opacity: 1; }
  /* 小猫灯点：可点的圆形热区。外观和别的灯点同一套，只是命中区给得大些（猫大）。
     出现与退场也照序章/木屋那一套（core/reveal.js）：一进来是干净的画，
     鼠标一动才淡入，停两秒自己退回去。
     注意灯点灭了照样能点 —— 命中靠坐标，不靠看不看得见，所以只淡出不收 pointer-events。 */
  .beach-cat {
    position: absolute; z-index: 4;
    display: grid; place-items: center;
    cursor: pointer; padding: 0;
    border: none; background: transparent;
    opacity: 0;
    transition: opacity 520ms ease;
  }
  .beach-stage.has-pointer .beach-cat { opacity: 1; }
  /* 推近的时候灯点跟着画面走会错位，直接收掉。
     这条必须排在 has-pointer 之后：两条都是三个类，同权重，靠顺序定胜负 */
  .beach-stage.is-awake .beach-cat { opacity: 0; pointer-events: none; }
  /* 白芯和木屋/序章那两个灯点是同一套规格：5px 白芯 + 暖晕 + 常驻呼吸 */
  .beach-cat span {
    display: block; width: 5px; height: 5px; border-radius: 50%;
    background: radial-gradient(circle,
      #FFFFFF 0%, #FFFFFF 40%, #FFE7BE 68%, #F3B26B 100%);
    box-shadow:
      inset 0 0 0 0.5px rgba(10,26,40,0.5),
      0 0 5px rgba(255,232,186,0.95),
      0 0 13px rgba(255,198,124,0.6),
      0 0 28px rgba(255,176,92,0.26);
    animation: lampCore 3.6s ease-in-out infinite;
    transition: box-shadow 320ms ease;
  }
  .beach-cat::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 28px; height: 28px; margin: -14px 0 0 -14px;
    border-radius: 50%;
    border: 1px solid rgba(255,228,186,0.62);
    opacity: 0.20; transform: scale(0.82);
    transition: opacity 300ms ease, transform 360ms cubic-bezier(0.2,0.8,0.3,1);
  }
  /* 指上去的回应，和序章/木屋用同一个类名 .hot：圆环亮起来、芯更烫、光标变手型 */
  .beach-cat.hot::after { opacity: 1; transform: scale(1); }
  .beach-cat.hot span {
    box-shadow:
      inset 0 0 0 0.5px rgba(10,26,40,0.45),
      0 0 9px rgba(255,244,218,1),
      0 0 22px rgba(255,208,140,0.9),
      0 0 44px rgba(255,178,94,0.46);
  }

  /* 猫醒过来时浮出来的那句话：一张手绘牛皮纸小纸条。
     和灯塔那张信纸是同一套语言（note-paper.jpg 材质、宋体标题、楷体正文、
     轻微 -1.2° 的歪），不是弹窗、不是报错。它是猫从兜里掏出来递给你的一张纸。
     位置由 JS 按 FOCUS（推近原点＝猫头）算，锚在 frame 上而不是动作层：
     放进 motion 会跟着 scale(2) 一起放大，字会变糊变大。 */
  .cat-bubble {
    position: absolute; z-index: 5;
    padding: 0;
    opacity: 0;
    transform: translate(-50%, 10px) rotate(1.6deg) scale(0.97);
    transition: opacity 520ms ease, transform 720ms cubic-bezier(0.22,0.8,0.3,1);
    pointer-events: none; /* 它压在猫附近，不能把猫的热区挡了 */
  }
  .cat-bubble.is-on { opacity: 1; transform: translate(-50%, 0) rotate(-1.2deg) scale(1); }
  .cat-bubble .cb-paper {
    position: relative;
    border-radius: 6px;
    background: url('./assets/intro/note-paper.jpg') center / cover no-repeat;
    box-shadow:
      0 16px 42px rgba(6,12,20,0.5),
      0 5px 14px rgba(6,12,20,0.38);
    padding: 18px 22px 16px;
    display: flex; align-items: center; gap: 12px;
    max-width: min(360px, 72vw);
    overflow: hidden;
  }
  /* 问号：落在纸面上的一笔手写墨字，圈一个很细的墨环，不涂底、不发亮 */
  .cat-bubble .cb-q {
    flex: none; display: grid; place-items: center;
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid rgba(122,88,46,0.45);
    color: #5B4323;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "华文楷体", serif;
    font-size: 20px; line-height: 1;
    font-weight: 400;
  }
  /* 正文：楷体，像写在纸上的一句自白 */
  .cat-bubble .cb-txt {
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "华文楷体", serif;
    font-size: 15px; line-height: 1.7; letter-spacing: 0.02em;
    color: #5A4020;
    text-shadow: 0 1px 0 rgba(255,250,236,0.5);
  }
  @media (max-width: 640px) {
    .cat-bubble .cb-paper { padding: 14px 16px 13px; gap: 9px; max-width: 76vw; }
    .cat-bubble .cb-q { width: 22px; height: 22px; font-size: 14px; }
    .cat-bubble .cb-txt { font-size: 13px; }
  }

  @media (max-width: 640px) {
    .intro h1 { font-size: 34px; }
    .room-head h1 { font-size: 20px; }
    .corner { top: 18px; left: 18px; }
    .room-head { left: 18px; bottom: 22px; }
  }
  /* ===== 序章 · 图片驱动 ===== */
  .intro-stage { position: fixed; inset: 0; overflow: hidden; background: #08182b; }
  .intro-water {
    position: fixed; inset: 0; z-index: 0;
    width: 100%; height: 100%; display: block;
    background: #08182b;
  }
  /* 灯塔特写的水面：挂在 detail 层里面，铺满 detail 矩阵即可。
     detail 本身 overflow:hidden，随它一起淡入淡出 */
  .intro-water--detail {
    position: absolute; inset: 0; z-index: auto;
    width: 100%; height: 100%;
  }
  .intro-stage.has-water .intro-layer.is-cover {
    opacity: 0; pointer-events: none;
  }
  /* WebGL 不可用时的降级：至少让画面有极缓的呼吸，不是死图 */
  .intro-stage:not(.has-water) .intro-layer.is-cover {
    inset: 0;
    animation: coverBreath 26s ease-in-out infinite alternate;
  }
  @keyframes coverBreath {
    from { transform: scale(1); }
    to { transform: scale(1.05); }
  }
  .intro-stage::after {
    content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at 50% 48%, transparent 56%, rgba(3,10,18,0.30) 100%);
  }

  /* ---------- 序章 · 左上角两行 ---------- */
  /* 它不是"网页的标题栏"，是压在画面上的一层字幕：
     没有底板、没有描边、没有玻璃拟态，只有字本身的重量。
     加底板就会在海上浮出一个矩形，那正是这一版要避免的。

     字体用思源宋体（变量字重，系统里装的是 NotoSerifSC-VF.ttf）。
     为什么敢用宋体：这是油画海面上的片名，宋体的横细竖粗和画面的笔触是一路的；
     系统宋体（SimSun）18px 以下发虚、大字发硬，思源宋体两个毛病都没有。
     要换成黑体细字，只改 --hero-font 这一行。 */
  .intro-hero {
    --hero-font: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", serif;
    position: absolute;
    left: clamp(26px, 5.2vw, 92px);
    top: clamp(22px, 8.5vh, 100px);
    z-index: 3;
    pointer-events: none;
    color: #F4EBD9;
    /* 进来时从下方 18px 浮上来。用 transition + hero-show 类，
       不用 animation —— animation 的 fill:forwards 会盖掉后面
       「打开灯塔特写时把标题收起来」那条 opacity:0 */
    opacity: 0;
    transform: translateY(18px);
    transition:
      opacity 1100ms ease 220ms,
      transform 1500ms cubic-bezier(.19, 1, .22, 1) 220ms;
  }
  .intro-stage.hero-show .intro-hero { opacity: 1; transform: none; }
  /* 进了灯塔特写就收起来：那时候画面只剩那张照片，字幕必须让位。
     这条要写在 .hero-show 后面，同权重靠顺序压过它 */
  .intro-stage.has-detail .intro-hero {
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 380ms ease, transform 380ms ease;
  }
  /* 悬浮：一个 12 秒的来回，幅度 6px。
     水面本来就在动，字幕再动得快就成了廉价特效 —— 只有"呼吸"那么大 */
  .hero-in { animation: heroFloat 12s ease-in-out infinite alternate; }
  @keyframes heroFloat {
    from { transform: translateY(-6px); }
    to { transform: translateY(6px); }
  }

  /* 一道短横线，像片头字幕上的引导线 */
  .hero-rule {
    display: block;
    width: clamp(34px, 3.4vw, 62px); height: 1px;
    margin-bottom: clamp(13px, 1.5vw, 24px);
    background: linear-gradient(90deg, rgba(244, 235, 217, 0.9), rgba(244, 235, 217, 0));
  }
  /* 副行（第二行）：小、散、淡。中文大字距就是"空气感"。
     字距会在末尾多留一格 —— 但这一行是左对齐，不是居中，
     补回来反而会跟主标题的文字起点错开半格。所以不加 padding-left，
     让两行真正的第一个字形对齐在一条竖线上 */
  .hero-kicker {
    margin: 0.9em 0 0;
    font-family: var(--hero-font);
    font-size: clamp(15px, 1.7vw, 27px);
    font-weight: 400;
    line-height: 1.4;
    letter-spacing: 0.30em;
    color: rgba(242, 234, 216, 0.82);
    text-shadow: 0 1px 2px rgba(2, 10, 18, 0.55), 0 6px 26px rgba(2, 10, 18, 0.5);
  }
  /* 主标题（第一行）：正题，放大。就「鳄梨岛」三个字，可以放心放大 ——
     1440 下 74px、1920 下 88px，三个字不会冲出画面左上的安全区。
     字重 600，字距 0.04em 收拢 */
  .hero-line {
    margin: 0;
    font-family: var(--hero-font);
    font-size: clamp(48px, 5.1vw, 88px);
    font-weight: 600;
    line-height: 1.14;
    letter-spacing: 0.04em;
    color: #F8F0DE;
    text-shadow:
      0 1px 2px rgba(2, 10, 18, 0.55),
      0 12px 46px rgba(2, 10, 18, 0.6);
  }
  /* AI 两个字母：字距放松一点，让它们从中文的方块节奏里透一口气 */
  .hero-kicker .hero-ai {
    letter-spacing: 0.04em;
    font-weight: 500;
  }
  /* 全角逗号的字形只占左下四分之一格，剩下大半格是空白；
     再叠上 0.30em 字距，"AI"和"去"之间就裂开一个洞。
     只能收右边 —— 字形贴着左边框长，往左收会直接压到"AI"上（试过 -0.3em，
     逗号整个陷进字母里）。副行字距 0.30em，这里收右 0.36em，
     把逗号自己的空位 + 一个半字距一起抹掉，让它贴回"去"前面 */
  .hero-kicker .hero-comma {
    letter-spacing: 0;
    margin-right: -0.36em;
  }
  @media (prefers-reduced-motion: reduce) {
    .hero-in { animation: none; }
    .intro-hero { transition-duration: 1ms; transition-delay: 0ms; }
  }
  .intro-layer {
    position: absolute; z-index: 1;
    will-change: transform, opacity; transform-origin: 50% 50%;
  }
  .intro-layer img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    user-select: none; -webkit-user-drag: none;
  }
  .intro-layer.is-cover { opacity: 1; transition: opacity 600ms ease; }
  .intro-layer.is-cover.loaded { opacity: 1; }
  .intro-layer.is-scene { inset: 0; opacity: 0; pointer-events: none; transition: opacity 950ms ease; }
  .intro-layer.is-scene.on { opacity: 1; }

  .intro-layer.is-plaque .pad {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    filter: blur(36px) brightness(0.26) saturate(0.62);
    transform: scale(1.2);
  }
  .intro-layer.is-plaque img {
    position: absolute; left: 50%; top: 50%;
    width: min(46vw, 620px); height: auto;
    transform: translate(-50%, -50%);
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 26px 70px rgba(0,0,0,0.62);
  }

  .intro-guide {
    position: absolute; left: 50%; bottom: 5.5%; z-index: 3;
    transform: translateX(-50%);
    font-size: 12.5px; letter-spacing: 0.18em; white-space: nowrap;
    color: rgba(244,238,226,0.86);
    text-shadow: 0 1px 3px rgba(0,0,0,0.92), 0 4px 22px rgba(0,0,0,0.75);
    padding: 8px 18px; border-radius: 100px;
    background: rgba(6,16,24,0.32);
    backdrop-filter: blur(6px);
    pointer-events: none;
    transition: color 420ms ease, opacity 190ms ease;
  }
  /* 换文案时先淡出再换字，避免"啪"地跳一下 */
  .intro-guide.fading { opacity: 0; }
  .intro-guide.on { color: #F5C88F; }

  .intro-dot {
    /* 现在是「热区包围盒」，left/top 取左上角，宽高即命中范围 */
    position: absolute; z-index: 3;
    display: grid; place-items: center;
    pointer-events: none;
    /* 一进来是一幅干净的画，鼠标一动灯点才淡入 ——
       常驻的小点会一直压在画面上，破坏画面的整体感 */
    opacity: 0;
    transition: opacity 520ms ease;
  }
  .intro-stage.has-pointer .intro-dot { opacity: 1; }
  .intro-stage.debug-dots .intro-dot { opacity: 1; }
  /* 灯点和木屋内景用同一套：白芯 + 暖晕，常驻呼吸。
     取消悬停自动换场景之后，它就是"这里能点"的唯一提示，不能只是装饰 */
  .intro-dot span {
    display: block; width: 5px; height: 5px; border-radius: 50%;
    background: radial-gradient(circle,
      #FFFFFF 0%, #FFFFFF 40%, #FFE7BE 68%, #F3B26B 100%);
    box-shadow:
      inset 0 0 0 0.5px rgba(10,26,40,0.5),
      0 0 5px rgba(255,232,186,0.95),
      0 0 13px rgba(255,198,124,0.6),
      0 0 28px rgba(255,176,92,0.26);
    animation: lampCore 3.6s ease-in-out infinite;
    transition: box-shadow 320ms ease;
  }
  .intro-dot::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 28px; height: 28px; margin: -14px 0 0 -14px;
    border-radius: 50%;
    border: 1px solid rgba(255,228,186,0.62);
    opacity: 0.20; transform: scale(0.82);
    transition: opacity 300ms ease, transform 360ms cubic-bezier(0.2, 0.8, 0.3, 1);
  }
  .intro-dot.hot::after { opacity: 1; transform: scale(1); }
  .intro-dot.hot span {
    box-shadow:
      inset 0 0 0 0.5px rgba(10,26,40,0.45),
      0 0 9px rgba(255,244,218,1),
      0 0 22px rgba(255,208,140,0.9),
      0 0 44px rgba(255,178,94,0.46);
  }
  .intro-stage.debug-dots .intro-dot {
    outline: 1px solid rgba(120,255,150,0.95);
    background: rgba(120,255,150,0.12);
  }
  .intro-stage.debug-dots .intro-dot span {
    width: 9px; height: 9px; background: #FF3B30;
    box-shadow: 0 0 0 2px #fff, 0 0 18px rgba(255,59,48,0.9);
    animation: none; opacity: 1;
  }
  .intro-stage.is-compact .intro-dot { display: none; }
  @keyframes dotPulse {
    0%, 100% { opacity: 0.32; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.32); }
  }
  .intro-guide.on { color: #F2C68C; }

  /* ===== 灯塔特写 · 可点光标 + 羊皮纸信纸 ===== */
  /* 光标与首页灯点同一套行为（core/reveal.js）：鼠标不动它不出现，
     动了才浮现、停两秒自己退场；悬停时由 :hover 代替首页的 .hot 点亮 */
  .lighthouse-cursor {
    position: absolute; z-index: 5;
    display: grid; place-items: center;
    cursor: pointer;
    /* <button> 的浏览器默认外观必须彻底清掉，否则光点外面会套一个灰底+边框的方框。
       尺寸给一个 34px 的透明命中区，并用 -50% 偏移让灯芯正好落在图片坐标上 */
    width: 34px; height: 34px; margin: 0;
    padding: 0; border: 0; border-radius: 50%;
    background: transparent; box-shadow: none;
    appearance: none; -webkit-appearance: none;
    outline: none; -webkit-tap-highlight-color: transparent;
    font: inherit; color: inherit;
    transform: translate(-50%, -50%);
    opacity: 0; transition: opacity 520ms ease;
    pointer-events: auto;
  }
  .intro-stage.has-detail.has-pointer .lighthouse-cursor { opacity: 1; }
  .lighthouse-cursor span {
    display: block; width: 5px; height: 5px; border-radius: 50%;
    background: radial-gradient(circle,
      #FFFFFF 0%, #FFFFFF 40%, #FFE7BE 68%, #F3B26B 100%);
    box-shadow:
      inset 0 0 0 0.5px rgba(10,26,40,0.5),
      0 0 5px rgba(255,232,186,0.95),
      0 0 13px rgba(255,198,124,0.6),
      0 0 28px rgba(255,176,92,0.26);
    animation: lampCore 3.6s ease-in-out infinite;
    transition: box-shadow 320ms ease;
  }
  .lighthouse-cursor::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 28px; height: 28px; margin: -14px 0 0 -14px;
    border-radius: 50%;
    border: 1px solid rgba(255,228,186,0.62);
    opacity: 0.20; transform: scale(0.82);
    transition: opacity 300ms ease, transform 360ms cubic-bezier(0.2, 0.8, 0.3, 1);
  }
  .lighthouse-cursor:hover::after { opacity: 1; transform: scale(1); }
  /* 键盘聚焦时给圆环，不用浏览器默认的方框 */
  .lighthouse-cursor:focus-visible::after { opacity: 1; transform: scale(1); }
  .lighthouse-cursor:hover span {
    box-shadow:
      inset 0 0 0 0.5px rgba(10,26,40,0.45),
      0 0 9px rgba(255,244,218,1),
      0 0 22px rgba(255,208,140,0.9),
      0 0 44px rgba(255,178,94,0.46);
  }

  /* 信纸：手绘羊皮纸（note-paper.jpg，带罗盘/灯塔/椰林/鲸鱼花边）。
     文字必须落在中央那块素纸上 —— padding 撑到花边以内 */
  .lighthouse-note {
    position: absolute; z-index: 6;
    width: clamp(300px, 32vw, 440px);
    padding: 0;
    opacity: 0; pointer-events: auto;
    transform: translateY(14px) rotate(-1.2deg);
    transition: opacity 620ms cubic-bezier(0.2,0.8,0.3,1),
                transform 620ms cubic-bezier(0.2,0.8,0.3,1);
  }
  .lighthouse-note.on { opacity: 1; transform: translateY(0) rotate(-1.2deg); }
  .lighthouse-note .paper {
    position: relative;
    border-radius: 6px;
    background: url('./assets/intro/note-paper.jpg') center / cover no-repeat;
    box-shadow:
      0 14px 40px rgba(6,12,20,0.55),
      0 4px 12px rgba(6,12,20,0.4);
    padding: clamp(40px, 5.2vw, 64px) clamp(36px, 4.6vw, 58px);
    overflow: hidden;
  }
  /* 标题：思源宋体，字距拉开，像写信的抬头 */
  .lighthouse-note h3 {
    position: relative; z-index: 1;
    margin: 0 0 0.7em;
    font-family: var(--hero-font);
    font-size: clamp(20px, 2.2vw, 27px);
    font-weight: 700;
    letter-spacing: 0.12em;
    color: #5B4323;
    text-align: center;
  }
  .lighthouse-note h3::after {
    content: ''; display: block; width: 52px; height: 2px;
    margin: 0.55em auto 0;
    background: linear-gradient(90deg, transparent, rgba(122,88,46,0.55), transparent);
  }
  /* 正文：楷体，像手写。行距放宽、字距微收，读起来像一封信 */
  .lighthouse-note p {
    position: relative; z-index: 1;
    margin: 0 0 0.9em;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "华文楷体", "Noto Serif SC", serif;
    font-size: clamp(16px, 1.55vw, 19px);
    line-height: 1.95;
    letter-spacing: 0.03em;
    color: #5A4020;
    text-shadow: 0 1px 0 rgba(255,250,236,0.5);
  }
  .lighthouse-note p:last-child { margin-bottom: 0; }
  /* 强调句：墨色更重一点 */
  .lighthouse-note p em {
    font-style: normal; color: #3E2C14; font-weight: 700;
  }
  /* 落款 */
  .lighthouse-note .sign {
    position: relative; z-index: 1;
    margin-top: 1.1em; text-align: right;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "华文楷体", serif;
    font-size: clamp(15px, 1.4vw, 18px);
    color: #6B4E28; letter-spacing: 0.06em;
  }

  .intro-entries {
    position: absolute; left: 50%; bottom: 7%; z-index: 3;
    transform: translateX(-50%);
    display: none; gap: 8px;
  }
  .intro-stage.is-compact .intro-entries { display: flex; }
  .intro-stage.is-compact .intro-guide { display: none; }
  .intro-entries button {
    padding: 10px 16px; border-radius: 100px;
    background: rgba(8,20,30,0.62); backdrop-filter: blur(10px);
    border: 1px solid rgba(240,226,200,0.22);
    color: #EFE6D4; font-size: 12px; font-family: inherit;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }

  .intro-toast {
    position: absolute; left: 50%; bottom: 13%; z-index: 4;
    transform: translate(-50%, 10px);
    padding: 11px 22px; border-radius: 100px; white-space: nowrap;
    background: rgba(8,20,30,0.7); backdrop-filter: blur(10px);
    border: 1px solid rgba(232,183,122,0.26);
    color: #F3E9D6; font-size: 13px; letter-spacing: 0.04em;
    opacity: 0; pointer-events: none;
    transition: opacity 320ms ease, transform 320ms ease;
  }
  .intro-toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ===== 序章 · 细节图（点灯塔这类热区，就地铺满画面看特写） ===== */
  /* 宽高由 JS 按图片比例写进来，和主图区域完全重合：
     两者本来同比例，所以非 16:9 窗口下黑边的位置也一致，切换时不会跳一下 */
  .intro-layer.is-detail {
    position: absolute; z-index: 1;
    overflow: hidden;
    opacity: 0; pointer-events: none;
    transition: opacity 680ms ease;
  }
  .intro-layer.is-detail.on { opacity: 1; }
  /* 同比例，cover 不会裁掉任何东西。
     34 秒推近 3.5% —— 盯着看察觉不到，离开一会儿回来会觉得它近了一点。
     没有这个，一屏静止的插画压满画面会像图片没加载完 */
  .intro-layer.is-detail img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    animation: detailBreath 34s ease-in-out infinite alternate;
    user-select: none; -webkit-user-drag: none;
  }
  @keyframes detailBreath {
    from { transform: scale(1.0); }
    to { transform: scale(1.035); }
  }

  /* 细节图的退路。位置和木屋内景的返回键一致，只是把暖色换成夜色 */
  .intro-back {
    position: absolute; left: 26px; top: 22px; z-index: 4;
    display: none; align-items: center; gap: 7px;
    padding: 9px 18px 9px 14px; border-radius: 100px;
    background: rgba(6,16,24,0.5);
    border: 1px solid rgba(212,224,238,0.22);
    backdrop-filter: blur(10px);
    color: #E6EEF6; font-size: 12.5px; letter-spacing: 0.06em;
    font-family: inherit; cursor: pointer;
    transition: background 240ms ease, border-color 240ms ease, color 240ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  .intro-back i {
    font-style: normal; font-size: 16px; line-height: 1; margin-top: -2px;
    color: rgba(200,220,240,0.9);
  }
  .intro-back:hover {
    background: rgba(12,26,38,0.72);
    border-color: rgba(224,236,248,0.5);
    color: #FFFFFF;
  }
  /* 进了细节图，灯点和窄屏入口都收起来 ——
     这一屏只该有那张画，多一个发光的小点都在抢戏。
     这几条要写在 .has-pointer / .is-compact 之后才压得住 */
  .intro-stage.has-detail .intro-dot { opacity: 0; }
  .intro-stage.has-detail .intro-entries { display: none; }
  .intro-stage.has-detail .intro-back { display: inline-flex; }

  /* ===== 木屋 · 内景 ===== */
  /* 底色是油画里的暗木色，letterbox 时露出来的边就像屋里的阴影，不跳 */
  .cabin-stage { position: fixed; inset: 0; overflow: hidden; background: #0B0805; }
  .cabin-frame {
    position: absolute; overflow: hidden;
    background: #0B0805;
  }
  .cabin-layer {
    position: absolute; inset: 0;
    opacity: 0;
    /* 所有交互都走自己的命中判定，图层本身不接管指针 */
    pointer-events: none;
    transition: opacity 760ms ease;
  }
  .cabin-layer.on { opacity: 1; }
  .cabin-layer img {
    width: 100%; height: 100%; display: block;
    object-fit: cover;
    user-select: none; -webkit-user-drag: none;
  }
  /* 推近感：进来时略大，落回原尺寸。
     结束状态必须是 scale(1)，否则热区会和画面差一点点 */
  .cabin-layer.settle img {
    animation: cabinSettle 1100ms cubic-bezier(0.22, 0.7, 0.24, 1) both;
  }
  @keyframes cabinSettle {
    from { transform: scale(1.055); }
    to { transform: scale(1); }
  }

  /* 翻页视频：盖在当前画面之上，播完停在尾帧。
     铺法和底图一致（cover），否则比例一变就和底图错位 */
  .cabin-video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    object-fit: cover;
    opacity: 0;
    transition: opacity 420ms ease;
    pointer-events: none;
  }
  .cabin-video.on { opacity: 1; }

  /* ===== 信纸弹层：媒体报道辑录 ===== */
  /* 翻到「易小楠」那一页定格后递上来的那张纸。
     尺寸用宽度反推高度（width 取 min(视口宽, 视口高对应的宽)），
     这样竖版纸在横屏和竖屏里都不会溢出；热区是百分比，跟着纸等比例缩放，
     所以任何窗口大小下都压在对应的字上。 */
  .cabin-letter {
    position: absolute; inset: 0; z-index: 7;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(10px, 1.6vh, 18px);
    padding: 4vh 4vw;
    opacity: 0; pointer-events: none;
    transition: opacity 520ms ease;
  }
  .cabin-letter.on { opacity: 1; pointer-events: auto; }
  /* 幕布：压暗背后的书页，让这张纸成为唯一焦点；点它收起 */
  .cabin-letter-veil {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 46%,
      rgba(8,6,4,0.46) 0%, rgba(8,6,4,0.72) 62%, rgba(6,5,3,0.86) 100%);
    cursor: default;
  }
  .cabin-letter-paper {
    position: relative;
    width: min(88vw, calc(86vh * 1280 / 1706));
    border-radius: 3px;
    box-shadow:
      0 30px 80px rgba(4,3,2,0.72),
      0 8px 24px rgba(4,3,2,0.5);
    transform: translateY(16px) scale(0.986);
    transition: transform 640ms cubic-bezier(0.22, 0.8, 0.3, 1);
  }
  .cabin-letter.on .cabin-letter-paper { transform: translateY(0) scale(1); }
  /* 三页共用同一张纸：纸的宽高由 aspect-ratio 定死，页面绝对定位叠在上面。
     翻页 = 换页 —— 出去的往左退一点并淡掉，进来的从右边滑回来。
     之所以不给整张纸做 3D 翻转：纸背面是另一页的内容，真翻就得画背面，
     而这里的"页"是网页截图，翻到一半露出的白肚皮会很假。 */
  .cabin-letter-page {
    position: absolute; inset: 0;
    opacity: 0; pointer-events: none;
    transform: translateX(30px) scale(0.994);
    transition: opacity 300ms ease,
                transform 440ms cubic-bezier(0.22, 0.8, 0.3, 1);
  }
  .cabin-letter-page.on {
    opacity: 1;
    transform: translateX(0) scale(1);
  }
  /* 只有整叠纸开着的时候，当前页才接指针。
     少了 `.cabin-letter.on` 这个前缀就是个坑：opacity: 0 不挡命中测试，
     收起后的那页仍然在吃点击，于是"再点书页重新递信纸"永远点不动。 */
  .cabin-letter.on .cabin-letter-page.on { pointer-events: auto; }
  /* 已经翻过去的那几页：停在左边，回来的时候才不会从右边凭空冒出来 */
  .cabin-letter-page.is-past { transform: translateX(-30px) scale(0.994); }
  .cabin-letter-img {
    display: block; width: 100%; height: 100%;
    border-radius: 3px;
    user-select: none; -webkit-user-drag: none;
  }
  /* 每条报道的热区。不画框、不加箭头 —— 纸面排满字，
     任何浮在字上的装饰都会打断阅读。只在悬停时铺一层极淡的朱色 + 内描边 */
  .cabin-letter-item {
    position: absolute;
    display: block;
    border-radius: 4px;
    text-decoration: none;
    /* 悬停前不可见，但仍然可点（浏览器认得它是链接） */
    background: transparent;
    outline: 1px solid transparent;
    transition: background 220ms ease, outline-color 220ms ease;
  }
  .cabin-letter-item:hover,
  .cabin-letter-item:focus-visible {
    background: rgba(163,46,36,0.075);
    outline-color: rgba(163,46,36,0.34);
  }
  .cabin-letter-item:focus-visible { outline-width: 2px; }
  /* 纸下方：说明 + 收起。不压在纸上 */
  .cabin-letter-bar {
    position: relative;
    display: flex; align-items: center; gap: 14px;
    flex-wrap: wrap; justify-content: center;
  }
  .cabin-letter-tip {
    font-size: 11.5px; letter-spacing: 0.14em;
    color: rgba(255,238,214,0.66);
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    min-width: 20ch; text-align: center;
  }
  /* 翻页键：低调的胶囊，别跟"收起信纸"抢位置 */
  .cabin-letter-nav {
    padding: 7px 14px 8px;
    border-radius: 100px;
    border: 1px solid rgba(255,232,192,0.22);
    background: rgba(12,9,6,0.34);
    backdrop-filter: blur(8px);
    color: rgba(255,237,210,0.9);
    font-size: 12px; letter-spacing: 0.08em;
    cursor: pointer;
    transition: background 240ms ease, border-color 240ms ease, opacity 240ms ease;
  }
  .cabin-letter-nav:hover:not(:disabled) {
    background: rgba(34,24,15,0.6);
    border-color: rgba(255,232,192,0.5);
  }
  /* 到头了就熄掉，但仍然占位 —— 按钮跳动比变灰更让人分心 */
  .cabin-letter-nav:disabled { opacity: 0.28; cursor: default; }
  .cabin-letter-close {
    padding: 7px 16px 8px;
    border-radius: 100px;
    border: 1px solid rgba(255,232,192,0.34);
    background: rgba(12,9,6,0.5);
    backdrop-filter: blur(8px);
    color: #FFEDD2;
    font-size: 12px; letter-spacing: 0.12em;
    cursor: pointer;
    transition: background 240ms ease, border-color 240ms ease;
  }
  .cabin-letter-close:hover {
    background: rgba(30,22,14,0.66);
    border-color: rgba(255,232,192,0.6);
  }

  /* 灯点：每一处可点的地方都放一盏，常驻轻微呼吸。
     它承担"这里能点"的全部提示职责，所以不能太亮也不能太暗 ——
     太亮抢画面的戏，太暗就白放了。 */
  .cabin-dot {
    position: absolute;
    width: 46px; height: 46px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    /* 和序章一致：先给一幅干净的画面，鼠标动了灯点才浮出来 */
    opacity: 0;
    transition: opacity 520ms ease;
  }
  .cabin-stage.has-pointer .cabin-dot { opacity: 1; }
  .cabin-dot .halo {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,222,170,0.40) 0%,
      rgba(255,190,116,0.15) 34%,
      rgba(255,170,90,0.05) 56%,
      transparent 72%);
    animation: lampHalo 3.6s ease-in-out infinite;
  }
  .cabin-dot .core {
    position: absolute; left: 50%; top: 50%;
    width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
    border-radius: 50%;
    /* 白芯要够白：暖色渐变在暖木上一混就发灰，读不出"灯"的意思。
       结构是「一个白点 + 一圈暖晕」，白点负责在暗处立住，暖晕负责像灯 */
    background: radial-gradient(circle,
      #FFFFFF 0%, #FFFFFF 40%, #FFE7BE 68%, #F3B26B 100%);
    /* 外侧暖光负责在暗处亮起来，内侧一圈极淡的暗边负责在亮处立住 —— 
       木屋这张图明暗跨度很大，只做发光的话，落在暖木上就糊没了 */
    box-shadow:
      inset 0 0 0 0.5px rgba(48,26,10,0.55),
      0 0 5px rgba(255,232,186,0.95),
      0 0 13px rgba(255,198,124,0.6),
      0 0 28px rgba(255,176,92,0.26);
    animation: lampCore 3.6s ease-in-out infinite;
    transition: box-shadow 320ms ease;
  }
  /* 静止时留一圈很淡的细环，算是"这里可以点"的底噪；
     指上去再亮到实线，过渡是连续的，不会突然出现 */
  .cabin-dot .ring {
    position: absolute; inset: 9px; border-radius: 50%;
    border: 1px solid rgba(255,228,186,0.6);
    opacity: 0.20; transform: scale(0.82);
    transition: opacity 300ms ease, transform 360ms cubic-bezier(0.2, 0.8, 0.3, 1);
  }
  .cabin-dot.hot .ring { opacity: 1; transform: scale(1); }
  .cabin-dot.hot .core {
    box-shadow:
      inset 0 0 0 0.5px rgba(48,26,10,0.5),
      0 0 9px rgba(255,244,218,1),
      0 0 22px rgba(255,208,140,0.9),
      0 0 44px rgba(255,178,94,0.46);
  }
  @keyframes lampCore {
    0%, 100% { transform: scale(0.9); opacity: 0.84; }
    50% { transform: scale(1.14); opacity: 1; }
  }
  @keyframes lampHalo {
    0%, 100% { opacity: 0.48; }
    50% { opacity: 0.95; }
  }

  .cabin-vignette {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at 50% 46%, transparent 52%, rgba(6,3,1,0.42) 100%);
  }

  .cabin-back {
    position: absolute; left: 26px; top: 22px; z-index: 4;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 18px 9px 14px; border-radius: 100px;
    background: rgba(14,9,4,0.5);
    border: 1px solid rgba(238,212,172,0.22);
    backdrop-filter: blur(10px);
    color: #EFE0C8; font-size: 12.5px; letter-spacing: 0.06em;
    font-family: inherit; cursor: pointer;
    transition: background 240ms ease, border-color 240ms ease, color 240ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  .cabin-back .arrow {
    font-size: 16px; line-height: 1; margin-top: -2px;
    color: rgba(240,206,158,0.9);
  }
  .cabin-back:hover {
    background: rgba(30,20,10,0.72);
    border-color: rgba(245,200,143,0.5);
    color: #FFF3E0;
  }

  /* ===== 环境声开关（右上角，和左上角返回同一套玻璃胶囊语言） ===== */
  .sound-toggle {
    position: fixed; right: 26px; top: 22px; z-index: 30;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 15px 9px 13px; border-radius: 100px;
    background: rgba(14,9,4,0.5);
    border: 1px solid rgba(238,212,172,0.22);
    backdrop-filter: blur(10px);
    color: #EFE0C8; font-size: 12.5px; letter-spacing: 0.06em;
    font-family: inherit; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 240ms ease, border-color 240ms ease, color 240ms ease;
  }
  .sound-toggle svg {
    display: block; flex: none; color: rgba(240,206,158,0.92);
    transition: color 240ms ease;
  }
  .sound-toggle .st-slash { display: none; }
  .sound-toggle:hover {
    background: rgba(30,20,10,0.72);
    border-color: rgba(245,200,143,0.5);
    color: #FFF3E0;
  }
  .sound-toggle:focus-visible { outline: 2px solid rgba(245,200,143,0.7); outline-offset: 2px; }
  .sound-toggle.is-off { color: #9C9A8C; border-color: rgba(238,212,172,0.13); }
  .sound-toggle.is-off svg { color: rgba(214,204,184,0.72); }
  .sound-toggle.is-off .st-wave { display: none; }
  .sound-toggle.is-off .st-slash { display: block; }

  /* ===== 水下放映厅 · 玻璃外面的水（WebGL） ===== */
  /* 有 WebGL 时用 canvas 顶掉静态图；拿不到 WebGL 就还是那张静态图，画面不会坏 */
  /* 只藏底图。写成 `img` 会把这一层里的缩略图、封面一并藏掉 */
  .cabin-layer.has-aqua img.scene-base { visibility: hidden; }
  .aqua-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    pointer-events: none;
  }

  /* ===== 林间 · 树叶的风（WebGL，同一套做法） ===== */
  .cabin-layer.has-foliage img.scene-base { visibility: hidden; }
  .foliage-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    pointer-events: none;
  }

  /* ===== 水下放映厅 · 幕上的片单 ===== */
  /* --u = 1% 幕宽，由 JS 在 measure() 里写进来（1440 窗口下约 4.9px）。
     幕只占画面宽度的 34%，所有尺寸都写 calc(var(--u) * n)，
     窗口一变整块排片跟着缩，字不会撑破卡片。
     
     这一块是"打在幕上的投影"，不是"幕上的一个面板"。
     所以容器不给底色、不给外发光 —— 原来那层 #04080a 的底比幕本身的黑更亮，
     还往外散一圈冷光，四角直角、边界分明，一眼就是银幕上贴了块发光的屏。
     现在完全透明，底下 room.jpg 的黑幕自己透上来，两者是同一块黑。 */
  .cinema-slot {
    --u: 4.6px;
    position: absolute; z-index: 3;
    /* 图层整体不接指针（交互自己判），这里必须收回来 —— 卡片要能点 */
    pointer-events: auto;
    background: transparent;
    overflow: hidden;
  }
  .cabin-layer:not(.on) .cinema-slot { pointer-events: none; }

  /* ---------- 排片 ---------- */
  .cs-board {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: calc(var(--u) * 1.6) calc(var(--u) * 2.4) calc(var(--u) * 1.2);
    color: #E9EFEC;
    transition: opacity 300ms ease;
    /* 内容在接近幕边缘时淡出。
       没有这一层的话，排片区是个规规矩矩的矩形，四角直角、边界分明，
       在幕上读成"又贴了一块屏" —— 而幕本身的边缘是画出来的毛边，
       两者对不上就露馅。让它往外淡，边界就没了 */
    -webkit-mask-image: radial-gradient(ellipse 100% 104% at 50% 48%, #000 88%, transparent 100%);
    mask-image: radial-gradient(ellipse 100% 104% at 50% 48%, #000 88%, transparent 100%);
    /* 关键的一层：让排片与**幕上的像素**混合，而不是盖在幕上面。
       screen 模式下黑色等于透明、亮色做加法 —— 这正是投影的物理行为：
       幕是那块黑，字和画面是打在上面的光。
       加上这一条之后，片单那片"灰底"彻底消失，幕的纹理直接参与进来，
       边界也就不存在了（试过只给缩略图加，效果差一截） */
    mix-blend-mode: screen;
  }
  /* 投影的光斑 —— 2026-10-23 移除了。
     原来这里有一层 rgba(206,232,236,0.048) 的径向渐变，本意是"光打在这里"。
     但 radial-gradient 默认按 farthest-corner 铺，椭圆会撑到 board 的矩形之外，
     再被 .cinema-slot 的 overflow 一刀切成直角 —— 于是幕上浮出一个边界清晰、
     亮度整个抬高五六级的矩形。用户说的"还是单独一个屏幕"，量下来就是这个：
     幕内空白处 9，光斑区 16~27，一眼能看出有一块方的。
     片单只需要文字和画面本身，黑幕的纹理直接透上来才对 */
  .cinema-slot.is-playing .cs-board { opacity: 0; pointer-events: none; }

  /* 标题居中、两侧拉出细线，像片头字幕。
     原来左标题 + 右提示并排，那是网页顶栏的写法 */
  .cs-head {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    gap: calc(var(--u) * 2);
    padding-bottom: calc(var(--u) * 1.2);
  }
  .cs-head::before,
  .cs-head::after {
    content: '';
    flex: 1; height: 1px;
  }
  .cs-head::before {
    background: linear-gradient(90deg, transparent, rgba(200, 226, 226, 0.24));
  }
  .cs-head::after {
    background: linear-gradient(90deg, rgba(200, 226, 226, 0.24), transparent);
  }
  .cs-title {
    /* 3.15u：1440 窗口下约 15.5px。原来 2.85u（14px）——
       片单层的标题就是分类名，它得比下面的片名大一号，层次才立得住。
       抬高片名（见 .cs-name）之后必须跟着抬，否则标题比条目还小 */
    font-size: calc(var(--u) * 3.15); letter-spacing: 0.34em;
    /* 字距会让末尾多出一格空白，左侧补回来才是视觉居中 */
    padding-left: 0.34em;
    color: #EAF2F0; font-weight: 500; white-space: nowrap;
    text-shadow: 0 0 calc(var(--u) * 1.3) rgba(190, 226, 232, 0.32);
  }
  /* 提示落在最底下，像银幕上的一行小字 */
  .cs-foot {
    position: relative;
    padding-top: calc(var(--u) * 0.9);
    text-align: center;
    font-size: calc(var(--u) * 1.42); letter-spacing: 0.24em;
    padding-left: 0.24em;
    color: rgba(178, 202, 202, 0.34);
  }

  /* ---------- 两层：先四类，再片单 ---------- */
  /* 幕上现在是两层。body 只负责占住 head 和 foot 之间的那块地方，
     两层都绝对定位叠在它上面，靠 board 的 .is-l2 交叉淡入淡出。
     不用 display:none 硬切 —— 在幕上那就是"翻了一页 PPT"，
     淡一下、错开一点点位置，才像镜头推到下一格。 */
  .cs-body {
    position: relative;
    flex: 1; min-height: 0;
  }
  .cs-page {
    position: absolute; inset: 0;
    transition: opacity 190ms ease, transform 260ms cubic-bezier(.22, .61, .36, 1);
  }
  /* 没被打开的那一层：往侧面退一点、淡掉、不接指针 */
  .cs-cols { opacity: 0; transform: translateX(7%); pointer-events: none; }
  .cs-board.is-l2 .cs-cats { opacity: 0; transform: translateX(-7%); pointer-events: none; }
  .cs-board.is-l2 .cs-cols { opacity: 1; transform: none; pointer-events: auto; }

  /* 第一层：四格一排，像放映厅门口贴的四张海报。
     试过 2×2 —— 幕是 2.2:1 的扁长条，两列各占一半之后，
     每格右边空出七十来像素，四块内容孤零零挂在左边，看着很散。
     一排四个把幕面横向铺满，四类的关系也变成"并列"而不是"两组"。 */
  .cs-cats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: calc(var(--u) * 2.6);
    align-content: center;
    padding-top: calc(var(--u) * 0.4);
  }
  .cs-cat {
    display: flex; flex-direction: column; align-items: center;
    gap: calc(var(--u) * 0.95);
    width: 100%; min-width: 0;
    padding: 0;
    border: none;
    background: none;
    font-family: inherit; text-align: center;
    color: inherit; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  /* 这一层的缩略图是**海报**，占满整格宽（16:9），不是列表里那条小图 */
  .cs-cat .cs-thumb {
    width: 100%; height: auto;
    aspect-ratio: 16 / 9;
  }
  .cs-cat .cs-txt { align-items: center; gap: calc(var(--u) * 0.25); }
  /* 分类名比片名大一号 —— 这一层是"门",不是"条目" */
  .cs-cat .cs-name {
    font-size: calc(var(--u) * 3.05);
    letter-spacing: 0.10em;
    /* 字距会把整行往右推，居中时左边补回来 */
    margin-left: 0.10em;
  }
  .cs-count {
    font-size: calc(var(--u) * 1.5);
    letter-spacing: 0.18em;
    padding-left: 0.18em;
    color: rgba(178, 202, 202, 0.42);
  }
  .cs-cat:hover .cs-name { color: #FFFFFF; }
  .cs-cat:hover .cs-thumb img {
    opacity: 1;
    filter: saturate(0.96) contrast(1.06) brightness(1.04);
  }

  /* 第二层：某一类的片子，摊成两列 */
  .cs-cols {
    display: grid; grid-template-columns: 1fr 1.06fr;
    gap: calc(var(--u) * 3);
    padding-top: calc(var(--u) * 0.7);
    /* 一个分类最多四部，两列摊开也就两行 —— 顶头排会剩一大片空的幕，
       看着像"没加载完"。整块垂直居中，空就上下平分，是留白不是故障 */
    align-content: center;
  }
  /* 左列 3 条、右列 4 条时会空一块 —— 就让它空着。
     试过 space-between 拉齐两列底边，结果分组之间被撑出一道大口子。
     排片表本来就该有留白，那块空在幕上就是黑幕本身 */
  .cs-col {
    display: flex; flex-direction: column; justify-content: flex-start;
    gap: calc(var(--u) * 2.0); min-width: 0;
  }

  /* 只有一部的分类：居中当主打放。
     一部片子孤零零挂在左上角，在一整块幕上读起来像"没加载完"；
     居中了、缩略图放大到 22u，才像这一类的"主片" */
  .cs-cols.is-one {
    display: flex; align-items: center; justify-content: center;
    gap: 0;
  }
  .cs-cols.is-one .cs-col { flex: 1 1 auto; min-width: 0; align-items: center; }
  /* 只有一部时右列是空的，但它照样占 100% 宽 —— 两列一起居中会把卡片推歪，
     量出来卡片左边直接跑到幕外面。空列直接不显示 */
  .cs-cols.is-one .cs-col:empty { display: none; }
  .cs-cols.is-one .cs-card { justify-content: center; }
  /* 只有一部时整条幕都是它的，没有第二列来挤 */
  .cs-cols.is-one .cs-thumb {
    width: calc(var(--u) * 26); height: calc(var(--u) * 14.6);
  }

  /* ---------- 大幕上的片单：海报格 ---------- */
  /**
   * 这一段是 2026-10-25 改的，起因是"片名和图片都有点小，与屏幕不匹配"。
   *
   * 原来片单层是"缩略图在左、片名在右"的排片表：一条 220px 宽的卡，
   * 图只占 99px（五分之一幕宽），旁边那条文字栏还剩三十来像素空着没人用。
   * 想再把图放大就顶到片名了 —— 名字是 nowrap + 省略号，一挤就截字。
   * 也就是说，横向排布的这张表**结构上就到头了**，调参数只能挪几个像素，
   * 所以第一次调大 25% 用户看着还是"没动"。
   *
   * 现在改成海报格：图占满整格宽（16:9），片名落在图下面。
   * 同样的幕里，一部片分到的宽度从 220 变成 145（三列）或 226（两列），
   * 而图从"卡里的一小块"变成"整格就是这张图"，面积翻倍还不止：
   *   三列 145×82（原 99×55）；两列 226×127；单部 227×128。
   *
   * 列数不写死，交给 auto-fit：格子最小 21u（约 104px），幕宽 493 时正好排得下四列，
   * 于是 1/2/3/4 部都能自适应 —— 三列时每格 145，两列 226，一部居中放大的那种另有 is-one。
   * 以后哪个分类多到第五部也不会溢出，只会多一行。
   *
   * 只在大幕上生效（compact / tiny 另有一套压扁规则，见下面），
   * 所以小窗口那两档的行为一个字节都没变。
   */
  .cinema-slot:not(.is-compact):not(.is-tiny) .cs-cols {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(calc(var(--u) * 21), 1fr));
    gap: calc(var(--u) * 1.6) calc(var(--u) * 3.4);
    align-content: center;
    padding-top: calc(var(--u) * 0.7);
  }
  /* 两列容器是给 compact 档用的（那里还是"图左字右"的排片表）。
     大幕上让它散架，卡片直接成为上面那个格子的子项 —— 这样不用改 JS 的分栏逻辑，
     DOM 顺序（第一列在前、第二列在后）也正好是网格的流序 */
  .cinema-slot:not(.is-compact):not(.is-tiny) .cs-col { display: contents; }

  .cinema-slot:not(.is-compact):not(.is-tiny) .cs-card {
    flex-direction: column;
    align-items: stretch;
    gap: calc(var(--u) * 0.9);
    padding: 0;
    text-align: center;
  }
  .cinema-slot:not(.is-compact):not(.is-tiny) .cs-thumb {
    width: 100%; height: auto;
    aspect-ratio: 16 / 9;
  }
  .cinema-slot:not(.is-compact):not(.is-tiny) .cs-txt {
    align-items: center;
    gap: calc(var(--u) * 0.35);
  }
  /* 3.05u ≈ 15px：和第一层的分类名（也是 3.05u）拉平 —— 一格一张海报，
     两层的条目本来就该一样大；标题 3.15u 仍高它们一档 */
  .cinema-slot:not(.is-compact):not(.is-tiny) .cs-name { font-size: calc(var(--u) * 3.05); }

  /* 单部的分类：整条幕只放一张，居中，卡宽 44u（约 217×122）。
     46u 试过 —— 1440 下量出来 166.8 的卡塞进 168.1 的排片区还差一点点，
     差的那 1px 正好落在下沿，纸边压到幕的黑边上。44u 留出余量 */
  .cinema-slot:not(.is-compact):not(.is-tiny) .cs-cols.is-one {
    display: grid;
    grid-template-columns: 1fr;
    justify-items: center;
    gap: 0;
    /* 单张卡是垂直居中的，上面那 0.7u 的补白在这里只会把卡片往下顶半个像素 ——
       1366×768 上量出来正好越出排片区下沿，去掉 */
    padding-top: 0;
  }
  .cinema-slot:not(.is-compact):not(.is-tiny) .cs-cols.is-one .cs-card {
    width: calc(var(--u) * 44);
  }

  /* 「回分类」：只在片单层出现。
     绝对定位，不参与 head 的居中计算 —— head 是"两侧拉线、标题居中"，
     往里面塞个按钮会把标题推歪。极小幕下它会被藏掉，
     那时标题本身（‹ 分类名）就是退路。 */
  .cs-up {
    position: absolute; z-index: 3;
    /* 顶边对齐 head 里那条横线的中线：横线会被这枚胶囊压住，
       读起来像面包屑"坐"在线上面，而不是浮在角落 */
    left: calc(var(--u) * 2.4); top: calc(var(--u) * 2.85);
    display: none; align-items: center; gap: calc(var(--u) * 0.28);
    padding: calc(var(--u) * 0.18) calc(var(--u) * 0.95) calc(var(--u) * 0.18) calc(var(--u) * 0.6);
    border-radius: 100px;
    border: 1px solid rgba(150, 220, 228, 0.22);
    background: rgba(4, 14, 18, 0.72);
    color: #DCEEF0;
    /* 1.9u ≈ 9.4px（原 1.45u / 7.2px）。7px 的胶囊里写"‹分类"，
       不是小一号，是看不清。这一层唯一的返回入口，得读得出来 */
    font-family: inherit; font-size: calc(var(--u) * 1.9); letter-spacing: 0.08em;
    cursor: pointer; opacity: 0.72;
    transition: opacity 220ms ease, background 220ms ease, border-color 220ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  .cs-up.on { display: inline-flex; }
  .cs-up i {
    font-style: normal; font-size: calc(var(--u) * 1.9); line-height: 1;
    margin-top: calc(var(--u) * -0.12);
  }
  .cs-up:hover {
    opacity: 1;
    background: rgba(14, 44, 50, 0.8);
    border-color: rgba(190, 240, 246, 0.5);
  }
  /* 片单层的标题（就是分类名）也能点，极小幕只剩这一条退路 */
  .cs-title.is-link { cursor: pointer; }
  .cs-title.is-link:hover { color: #FFFFFF; }
  /* 极小幕没有那颗「分类」胶囊，标题前面补一个 ‹，让它看着像个入口。
     大幕上不加 —— 那里已经有「‹ 分类」，再给标题加箭头就是两个 ‹ 打架 */
  .cinema-slot.is-tiny .cs-board.is-l2 .cs-title::before { content: '‹ '; opacity: 0.72; }


  .cs-card {
    display: flex; align-items: center; gap: calc(var(--u) * 1.1);
    width: 100%; min-width: 0;
    padding: calc(var(--u) * 0.26) 0;
    border: none;
    background: none;
    font-family: inherit; text-align: left;
    color: inherit; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  /* 悬停不给底色块 —— 一块会亮的矩形就是"卡片"的证据。
     只让这张图提亮、片名点起来，像投影的光刚好扫过这一条 */
  .cs-card:hover .cs-name { color: #FFFFFF; }
  .cs-card:hover .cs-thumb img {
    opacity: 1;
    filter: saturate(0.96) contrast(1.06) brightness(1.04);
  }

  /* 无圆角、无描边：它是一块投影出来的画面，不是卡片缩略图。
     底色也是透明 —— 原来给的是 #060809，比幕本身的黑亮一档，
     七个方块连起来就在幕上铺了一片灰 */
  .cs-thumb {
    position: relative; flex: 0 0 auto;
    /* 20u × 11.2u：1440 窗口下约 99×55。
       原来 15.5u × 8.7u（76×43）—— 一块 493px 宽的幕上放 76px 的图，
       缩成一小格，认片只能靠猜字。放大到五分之一幕宽，图才立得住。
       宽度是本列宽减去它和文字后仍有富余的那一档：
       两列最窄 220.9px，减去 99 和间距，片名还剩 116px，七个字放得下 */
    width: calc(var(--u) * 20); height: calc(var(--u) * 11.2);
    overflow: hidden;
    background: transparent;
  }
  .cs-thumb img {
    display: block; width: 100%; height: 100%;
    object-fit: cover;
    /* 降饱和、压亮度 —— 投在幕上的颜色不会那么艳，也不该比幕更"发光" */
    filter: saturate(0.80) contrast(1.06) brightness(0.86);
    opacity: 0.84;
    transition: opacity 240ms ease, filter 240ms ease;
  }
  /* 没有封面也没有片源的那一条：一块空着的格子，不拿别的片的截图冒充。
     不用斜纹 —— 斜纹是"待办占位符"的语汇，跟电影没关系 */
  .cs-thumb.is-blank {
    display: grid; place-items: center;
    box-shadow: inset 0 0 0 1px rgba(150, 190, 190, 0.13);
  }
  .cs-thumb.is-blank i {
    font-style: normal;
    font-size: calc(var(--u) * 1.35); letter-spacing: 0.16em;
    color: rgba(180, 205, 205, 0.40);
  }

  .cs-txt { display: flex; flex-direction: column; gap: calc(var(--u) * 0.2); min-width: 0; }
  .cs-name {
    /* 2.9u：1440 窗口下约 14.3px。原来 2.35u（11.6px）——
       跟左下角"拿走 12.5px"的返回按钮比，片名比它还小，读着费劲 */
    font-size: calc(var(--u) * 2.9); letter-spacing: 0.015em;
    color: #DFE9E6;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color 200ms ease;
    text-shadow: 0 0 calc(var(--u) * 0.9) rgba(200, 232, 236, 0.20);
  }
  .cs-sub {
    /* 1.95u ≈ 9.6px（原 1.6u / 7.9px）。7.9px 在任何屏上都不该是正文尺寸，
       它和片名一样要跟着片名抬 —— 但始终比片名小一档，不能抢主次 */
    font-size: calc(var(--u) * 1.95); letter-spacing: 0.04em;
    color: rgba(178, 202, 202, 0.44);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cs-card.is-pending .cs-name { color: rgba(232, 241, 239, 0.46); }

  /* ---------- 放映 ---------- */
  .cs-stage {
    position: absolute; inset: 0;
    background: #000;
    opacity: 0; pointer-events: none;
    transition: opacity 320ms ease;
  }
  .cinema-slot.is-playing .cs-stage { opacity: 1; pointer-events: auto; }

  .cs-video {
    display: block; width: 100%; height: 100%;
    /* 16:9 的片子放进 2.2:1 的幕里，左右留的黑边和黑幕融为一体 */
    object-fit: contain;
    background: #000;
  }
  .cs-video.is-off { display: none; }

  /* 「片单」压在幕的左上角。播放/进度/全屏都交给浏览器自带的控制条，
     只有"换一部"它没有，所以自己加这一个 */
  .cs-back {
    position: absolute; left: calc(var(--u) * 0.9); top: calc(var(--u) * 0.9); z-index: 2;
    display: inline-flex; align-items: center; gap: calc(var(--u) * 0.35);
    padding: calc(var(--u) * 0.3) calc(var(--u) * 1.1) calc(var(--u) * 0.3) calc(var(--u) * 0.75);
    border-radius: 100px;
    border: 1px solid rgba(150, 220, 228, 0.28);
    background: rgba(6, 18, 22, 0.6);
    backdrop-filter: blur(6px);
    color: #DCEEF0;
    font-family: inherit; font-size: calc(var(--u) * 1.7); letter-spacing: 0.06em;
    cursor: pointer; opacity: 0.72;
    transition: opacity 220ms ease, background 220ms ease, border-color 220ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  .cs-back i { font-style: normal; font-size: calc(var(--u) * 2.1); line-height: 1; margin-top: calc(var(--u) * -0.15); }
  .cs-back:hover {
    opacity: 1;
    background: rgba(14, 44, 50, 0.82);
    border-color: rgba(190, 240, 246, 0.55);
    color: #F2FCFD;
  }

  /* 片源没到 / 读不出来：幕上放一块提示牌，不假装能播。
     不铺底 —— 幕本身就是黑的，铺一块渐变反而露出边界 */
  .cs-plate {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: calc(var(--u) * 0.9); text-align: center; padding: 0 10%;
  }
  .cs-plate.on { display: flex; }
  .cs-plate-title {
    font-size: calc(var(--u) * 2.5); letter-spacing: 0.06em; color: #CFE6E8;
  }
  .cs-plate-note {
    font-size: calc(var(--u) * 1.7); line-height: 1.6; letter-spacing: 0.04em;
    color: rgba(159, 184, 188, 0.82);
  }

  /* ---------- 窄窗口（幕宽 < 400px） ---------- */
  /* 位置一律不动：left/top/width/height 由 JS 按幕框写死，永远和幕重合。
   *
   * 这里原来是把排片**挪出幕**、贴到画面底边，做成一块带圆角、实底、
   * 外投影的浮层 —— 那本身就是"幕外面的另一块屏"，正是要避免的。
   * 中间试过"单列 + 幕内滚动"，但片单最怕的就是"看着只有三部"：
   * 滚动条做得再细，用户也不知道幕里还能往下拨。
   * 现在是**两列压扁**：去掉副题、缩略图收到 30×17，七部一屏全在。
   *
   * 量过：幕 351×159 时列表区 338×118，两列正好 118，一部不缺；
   *       幕 274×125 时列表区 264×86，需要 88 —— 差 2px，
   *       靠 .cs-board 的下内边距再收 0.2u 抹平。 */
  .cinema-slot.is-compact .cs-board {
    padding: calc(var(--u) * 1.3) calc(var(--u) * 1.8) calc(var(--u) * 0.7);
  }
  .cinema-slot.is-compact .cs-head { padding-bottom: calc(var(--u) * 0.7); }
  .cinema-slot.is-compact .cs-foot { padding-top: calc(var(--u) * 0.5); }
  .cinema-slot.is-compact .cs-cols {
    grid-template-columns: 1fr 1.06fr;
    gap: calc(var(--u) * 1.8);
    overflow: hidden;
  }
  .cinema-slot.is-compact .cs-col { gap: calc(var(--u) * 0.8); }
  /* 分类那四格同理：一排四个本来就紧，间距一压就够放下 */
  .cinema-slot.is-compact .cs-cats {
    gap: calc(var(--u) * 1.6);
  }
  .cinema-slot.is-compact .cs-cat {
    gap: calc(var(--u) * 0.6);
  }
  /* 「共几部」在三百多像素的幕上是纯噪声，让位给"一排放得下" */
  .cinema-slot.is-compact .cs-count { display: none; }
  /* 副题在幕只有两三百像素宽时是纯噪声 —— 一行 7px 的字谁读得出来。
     留片名，副题让位给"一屏放完" */
  .cinema-slot.is-compact .cs-sub { display: none; }
  .cinema-slot.is-compact .cs-card {
    gap: calc(var(--u) * 0.8);
    padding: calc(var(--u) * 0.14) 0;
  }
  /* 幕只有两三百像素宽时 --u 会掉到 2~3px，按比例算出来的字号只有六七像素。
     给几个下限，宁可挤一点也要看得清 */
  .cinema-slot.is-compact .cs-title { font-size: max(calc(var(--u) * 3.0), 10px); }
  .cinema-slot.is-compact .cs-name { font-size: max(calc(var(--u) * 2.2), 8.5px); }
  /* 分类名要比片名大，压扁之后也得守住这个层次，否则两层看起来是同一个列表 */
  .cinema-slot.is-compact .cs-cat .cs-name { font-size: max(calc(var(--u) * 2.6), 10px); }
  .cinema-slot.is-compact .cs-foot { font-size: max(calc(var(--u) * 1.7), 7px); }
  .cinema-slot.is-compact .cs-up { font-size: max(calc(var(--u) * 1.5), 7.5px); }
  .cinema-slot.is-compact .cs-thumb {
    width: max(calc(var(--u) * 10.5), 30px);
    height: max(calc(var(--u) * 5.9), 17px);
  }
  /* 上面那条是小缩略图的尺寸，别把第一层那四张海报也改成 30×17。
     分类海报永远撑满整格宽，只让高度跟着比例走 */
  .cinema-slot.is-compact .cs-cat .cs-thumb {
    width: 100%; height: auto;
  }

  /* ---------- 窄窗口也改成海报格 ---------- */
  /**
   * 2026-10-25 补的一段。上一版只给大幕换了海报格，
   * 结果凡是从窄窗口看的人（WorkBuddy 的内嵌预览面板、没最大化的浏览器、
   * 1000px 上下的小窗口）都落在 `.is-compact` 档里，
   * 那档还是"图左字右 + 30×17 小图 + 8.5px 片名"的老样子 ——
   * 于是用户两次都说"没有任何改动"，因为对他看到的那一档确实一个像素都没变。
   *
   * 这一段把 compact 档也换成海报格：图占满格宽、片名在图下面。
   * 幕 351 宽时三列每格 109，图 109×61（原 30×17）；幕 274 宽时每格 86，图 86×48。
   * 副题依然不显示（两三列的时候它只会挤掉片名）。
   *
   * 选择器写成 `.is-compact:not(.is-tiny)` 而不是 `.is-compact`：
   * 一是和上面那批压扁规则同为三到四个类时按顺序定胜负，这里必须排在后面；
   * 二是极小幕（幕宽 < 200）还要留着自己那套"只显示片名"的退路。
   */
  .cinema-slot.is-compact:not(.is-tiny) .cs-cols {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(calc(var(--u) * 22), 1fr));
    gap: calc(var(--u) * 1.6) calc(var(--u) * 1.4);
    align-content: center;
    overflow: visible;
  }
  .cinema-slot.is-compact:not(.is-tiny) .cs-col { display: contents; }
  .cinema-slot.is-compact:not(.is-tiny) .cs-card {
    flex-direction: column;
    align-items: stretch;
    gap: calc(var(--u) * 0.6);
    padding: 0;
    text-align: center;
  }
  .cinema-slot.is-compact:not(.is-tiny) .cs-thumb {
    width: 100%; height: auto;
    aspect-ratio: 16 / 9;
  }
  .cinema-slot.is-compact:not(.is-tiny) .cs-txt { align-items: center; gap: 0; }
  /* 下限 10px：幕宽 274 时 u 只有 2.74，3.05u 算出来 8.4px，读不动 */
  .cinema-slot.is-compact:not(.is-tiny) .cs-name {
    font-size: max(calc(var(--u) * 3.05), 10px);
  }
  .cinema-slot.is-compact:not(.is-tiny) .cs-cols.is-one {
    display: grid;
    grid-template-columns: 1fr;
    justify-items: center;
    gap: 0;
  }
  /* 44u：幕 274（列表区 86 高）时 120×68 的卡正好放得下；再大一档就顶到下沿 */
  .cinema-slot.is-compact:not(.is-tiny) .cs-cols.is-one .cs-card {
    width: calc(var(--u) * 44);
  }

  /* ---------- 极小幕（幕宽 < 200px，基本就是手机竖屏） ---------- */
  /* 134×61 的幕里排片，怎么排都不可能"好看"，只能保证三件事：
     一、仍然在幕里；二、看得清还能点；三、**走得到上一层**。
     缩略图在这个尺寸下只是几个灰方块，拿掉；底部那行提示也拿掉。
     标题要留着 —— 它是这一层唯一的退路：片单层的标题就是「‹ 分类名」，
     点它回四类。原来连标题一起藏了，结果进了分类就出不来，只能按 Esc。 */
  .cinema-slot.is-tiny .cs-foot,
  .cinema-slot.is-tiny .cs-thumb { display: none; }
  .cinema-slot.is-tiny .cs-board {
    padding: calc(var(--u) * 1.0) calc(var(--u) * 1.4);
  }
  .cinema-slot.is-tiny .cs-head { padding-bottom: calc(var(--u) * 0.5); }
  /* 幕太窄，放不下那颗「分类」胶囊 */
  .cinema-slot.is-tiny .cs-up.on { display: none; }
  .cinema-slot.is-tiny .cs-title {
    font-size: 9px;
    /* 字太小不好点，给上下补出一点热区 */
    padding-top: 3px; padding-bottom: 3px;
  }
  .cinema-slot.is-tiny .cs-cats {
    /* 海报拿掉之后，四类就只剩四个名字 —— 134px 的幕放一排四个太挤，回到两列 */
    grid-template-columns: 1fr 1fr;
    gap: calc(var(--u) * 1.2) calc(var(--u) * 1.8);
    align-content: start;
  }
  .cinema-slot.is-tiny .cs-cat { padding: 1px 0; }
  .cinema-slot.is-tiny .cs-cols {
    grid-template-columns: 1fr 1fr;
    gap: calc(var(--u) * 1.6);
    overflow-y: auto;
    scrollbar-width: none;
  }
  .cinema-slot.is-tiny .cs-cols::-webkit-scrollbar { display: none; }
  .cinema-slot.is-tiny .cs-name { font-size: 8px; line-height: 1.3; }
  .cinema-slot.is-tiny .cs-cat .cs-name { font-size: 9px; letter-spacing: 0.06em; }
  .cinema-slot.is-tiny .cs-card { padding: 1px 0; }

  /* ===== 鳄梨岛地图（手绘藏宝图） ===== */
  /* 一张图铺在黑木桌面上：底色要暖，冷黑会把羊皮纸衬脏 */
  .map-stage { background: #14100A; }
  .map-stage .cabin-frame {
    background: #14100A;
    box-shadow: 0 24px 70px rgba(0,0,0,0.6);
  }
  /* 这张图不带推近动画：画是"摊开在桌上"的，不需要镜头推进 */
  .map-stage .cabin-layer { transition: opacity 620ms ease; }

  /* 每个地方盖一层"灯照上去"的光。
     平时完全透明 —— 一进来必须是干净的一张画。 */
  .map-hot {
    position: absolute;
    pointer-events: none;
    opacity: 0;
    transition: opacity 300ms ease;
  }
  .map-hot.on { opacity: 1; }

  /* 光从卷轴边缘散出去，落在周围的水和林子上。
     卷轴本身够亮，往上再加亮只会把它冲成奶白 —— 所以这盏灯的
     可见度全部来自它照亮的那圈暗处：那圈暖边才是"这里有人点着了灯"。
     用多层 box-shadow 而不是画一个椭圆：只有光，没有边线，
     也不会像贴在画上的 UI 框（画椭圆会露出椭圆的轮廓）。 */
  .map-hot .halo {
    position: absolute; inset: 1px;
    border-radius: 8px;
    box-shadow:
      0 0 10px 2px rgba(255,208,130,0.42),
      0 0 26px 8px rgba(255,188,96,0.26),
      0 0 62px 22px rgba(255,168,66,0.13),
      inset 0 0 20px rgba(255,216,156,0.16);
    animation: mapLamp 3.4s ease-in-out infinite;
  }
  @keyframes mapLamp {
    0%, 100% { opacity: 0.74; }
    50% { opacity: 1; }
  }

  /* 地图上的返回键：换成深褐墨色，压在羊皮纸上像盖的一枚签 */
  .map-stage .cabin-back {
    background: rgba(38,26,14,0.62);
    border-color: rgba(120,88,48,0.42);
    color: #F0E2C6;
  }
  .map-stage .cabin-back .arrow { color: rgba(226,186,124,0.95); }
  .map-stage .cabin-back:hover {
    background: rgba(52,36,20,0.82);
    border-color: rgba(190,148,88,0.6);
    color: #FFF6E4;
  }

  /* ===== 林间 · 耳机播放器 ===== */
  /* 一块暖玻璃压在夜色右下角。语言和返回键、提示牌是同一套：
     暗底 + 极细的暖边 + backdrop blur，不抢那幅画 */
  .lamp-player {
    position: absolute; right: 30px; bottom: 28px; z-index: 6;
    width: 336px; padding: 15px 17px 12px;
    border-radius: 16px;
    background: rgba(9,17,13,0.64);
    border: 1px solid rgba(238,212,172,0.20);
    backdrop-filter: blur(16px) saturate(1.06);
    box-shadow: 0 18px 48px rgba(0,0,0,0.52), inset 0 1px 0 rgba(255,236,205,0.07);
    color: #EFE0C8;
    /* 收起时往下沉一点、几乎缩回去，展开才落定 —— 不做从底下甩出来的抽屉 */
    opacity: 0;
    transform: translateY(9px) scale(0.985);
    pointer-events: none;
    transition: opacity 320ms ease, transform 380ms cubic-bezier(0.22, 0.7, 0.24, 1);
  }
  .lamp-player.on { opacity: 1; transform: none; pointer-events: auto; }

  .lp-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 13px;
  }
  .lp-tag {
    font-size: 10.5px; letter-spacing: 0.22em;
    color: rgba(243,213,168,0.62);
  }
  .lp-x {
    width: 20px; height: 20px; margin: -3px -4px -3px 0;
    display: grid; place-items: center;
    border: none; border-radius: 50%; background: none;
    color: rgba(240,222,192,0.5);
    font-family: inherit; font-size: 17px; line-height: 1; cursor: pointer;
    transition: color 200ms ease, background 200ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  .lp-x:hover { color: #FFF3E0; background: rgba(255,214,160,0.12); }

  .lp-now { display: flex; align-items: center; gap: 13px; }
  .lp-play {
    flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
    background: linear-gradient(160deg, rgba(255,214,158,0.17), rgba(255,178,94,0.06));
    border: 1px solid rgba(243,184,116,0.42);
    transition: border-color 220ms ease, background 220ms ease, transform 160ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  .lp-play:hover {
    border-color: rgba(255,214,160,0.82);
    background: linear-gradient(160deg, rgba(255,214,158,0.28), rgba(255,178,94,0.1));
  }
  .lp-play:active { transform: scale(0.94); }
  /* 三角形用边框画，比放一个 ▶ 字符靠谱：字符的基线在每台机器上都偏 */
  .lp-play .tri {
    width: 0; height: 0; margin-left: 3px;
    border-style: solid;
    border-width: 6.5px 0 6.5px 10.5px;
    border-color: transparent transparent transparent #FFE7BE;
  }
  .lp-play .pz { display: none; gap: 3px; }
  .lp-play .pz i {
    width: 2.5px; height: 12px; border-radius: 1px;
    background: #FFE7BE;
  }
  .lamp-player.is-playing .lp-play .tri { display: none; }
  .lamp-player.is-playing .lp-play .pz { display: flex; }

  .lp-meta { min-width: 0; }
  .lp-title {
    font-size: 16px; font-weight: 500; letter-spacing: 0.02em;
    color: #FFF3E0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 没有副题的曲子留一条空行，切歌时标题不会上下跳 */
  .lp-sub {
    margin-top: 3px; min-height: 14px;
    font-size: 11px; letter-spacing: 0.03em;
    color: rgba(238,224,200,0.5);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .lp-bar {
    position: relative; height: 16px; margin-top: 11px;
    cursor: pointer; touch-action: none;
  }
  .lp-bar::before {
    content: ''; position: absolute; left: 0; right: 0; top: 50%;
    height: 2px; margin-top: -1px; border-radius: 2px;
    background: rgba(238,216,182,0.16);
  }
  .lp-fill {
    position: absolute; left: 0; top: 50%; height: 2px; margin-top: -1px;
    width: 0; border-radius: 2px;
    background: linear-gradient(90deg, rgba(255,206,146,0.55), #FFD79C);
  }
  .lp-knob {
    position: absolute; left: 0; top: 50%;
    width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%;
    background: #FFF6E4;
    box-shadow: 0 0 8px rgba(255,206,146,0.85);
    /* 平时缩着，手放上去才长到实处 */
    transform: scale(0.55);
    transition: transform 200ms ease;
  }
  .lamp-player:hover .lp-knob { transform: scale(1); }

  .lp-times {
    display: flex; justify-content: space-between;
    font-size: 10px; letter-spacing: 0.08em;
    color: rgba(236,220,196,0.42);
    font-variant-numeric: tabular-nums;
  }

  .lp-list {
    list-style: none; margin: 10px 0 0; padding: 9px 0 0;
    border-top: 1px solid rgba(238,212,172,0.11);
    display: grid; gap: 1px;
  }
  .lp-trk {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px 7px 6px; margin: 0 -4px;
    border-radius: 9px; cursor: pointer;
    transition: background 220ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  .lp-trk:hover { background: rgba(255,214,160,0.07); }
  .lp-trk.on { background: rgba(255,214,160,0.055); }
  .lp-trk .lp-tr {
    font-size: 12.5px; letter-spacing: 0.02em;
    color: rgba(240,228,206,0.72);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color 220ms ease;
  }
  .lp-trk .lp-td {
    margin-left: auto; flex: 0 0 auto;
    font-size: 10.5px; letter-spacing: 0.06em;
    color: rgba(236,220,196,0.34);
    font-variant-numeric: tabular-nums;
  }
  .lp-trk.on .lp-tr { color: #FFD79C; }
  .lp-trk.on .lp-td { color: rgba(255,214,160,0.5); }

  /* 正在放的那一行的三根小柱：只有放歌时才跳，暂停就停在各自的高度。
     三根的高度和速度都不一样 —— 否则跳起来整齐得像一个"暂停"图标，
     和左边那颗播放键撞脸 */
  .lp-eq {
    flex: 0 0 auto; display: none;
    width: 11px; height: 11px; align-items: flex-end; gap: 2px;
  }
  .lp-trk.on .lp-eq { display: flex; }
  .lp-eq i {
    flex: 1; border-radius: 1px;
    background: #FFC983; opacity: 0.6;
  }
  .lp-eq i:nth-child(1) { height: 4px; }
  .lp-eq i:nth-child(2) { height: 9px; }
  .lp-eq i:nth-child(3) { height: 6px; }
  .lamp-player.is-playing .lp-trk.on .lp-eq i { animation: lpEq ease-in-out infinite; }
  .lamp-player.is-playing .lp-trk.on .lp-eq i:nth-child(1) { animation-duration: 0.92s; }
  .lamp-player.is-playing .lp-trk.on .lp-eq i:nth-child(2) { animation-duration: 1.24s; animation-delay: -0.31s; }
  .lamp-player.is-playing .lp-trk.on .lp-eq i:nth-child(3) { animation-duration: 1.06s; animation-delay: -0.62s; }
  @keyframes lpEq {
    0%, 100% { height: 3px; opacity: 0.5; }
    50% { height: 11px; opacity: 1; }
  }

  /* 耳机上那盏灯：放歌时呼吸得更慢，细环也亮起来，像里面在响 */
  .cabin-dot.is-playing .core,
  .cabin-dot.is-playing .halo { animation-duration: 2.2s; }
  .cabin-dot.is-playing .ring { opacity: 0.5; }

  @media (max-width: 640px) {
    .cabin-back { left: 14px; top: 14px; padding: 8px 15px 8px 12px; }
    /* 手机上只留图标，右上角本来就不宽 */
    .sound-toggle { right: 12px; top: 12px; padding: 9px 11px; }
    .sound-toggle .st-label { display: none; }
    /* 手机上铺到底部，宽度跟屏走，别缩成一块小卡 */
    .lamp-player {
      left: 12px; right: 12px; bottom: 14px; width: auto;
      padding: 13px 15px 10px;
    }
    .lp-trk { padding: 9px 8px 9px 6px; }
  }

  @media (max-width: 640px) {
    .intro-layer.is-plaque img { width: 78vw; }
    .intro-toast { font-size: 12px; padding: 10px 16px; }
  }

  /* ===== 录屏专用（只有 ?capture=1 时才会被插进页面） ===== */
  /* 假鼠标：headless 录屏里没有系统光标，不画一只，观众根本看不出在点哪儿。
     一圈一芯，白环加深色描边 —— 压在深海的暗处和纸面的亮处都得看得见。 */
  .tour-cursor {
    position: fixed; left: 0; top: 0; z-index: 9999;
    width: 0; height: 0;
    pointer-events: none;
    will-change: transform;
  }
  .tour-cursor .tc-ring {
    position: absolute; left: -18px; top: -18px;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.92);
    box-shadow: 0 0 0 1px rgba(20,28,24,0.42), 0 4px 14px rgba(10,16,14,0.45);
    transition: transform 140ms ease, opacity 140ms ease;
  }
  .tour-cursor .tc-dot {
    position: absolute; left: -4px; top: -4px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 1.5px rgba(20,28,24,0.55);
    transition: transform 140ms ease;
  }
  /* 按下：环收一圈、芯顿一下，像真的按下去 */
  .tour-cursor.is-down .tc-ring { transform: scale(0.66); opacity: 0.75; }
  .tour-cursor.is-down .tc-dot { transform: scale(1.5); }

  /* 场记板：一帧白闪，用来和录音里那声 1kHz 对上时间 */
  .tour-flash {
    position: fixed; inset: 0; z-index: 10000;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 40ms linear;
  }
  .tour-flash.on { opacity: 1; }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="labels"></div>
  <div id="overlay"></div>
  <div id="fade"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
